name: Example
options:
  bundleIdPrefix: dev.declarativecombine
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: en
packages:
  DeclarativeCombine:
    path: ..
  DeclarativeUIKit:
    url: https://github.com/nothingsh/DeclarativeUIKit
    from: "0.1.0"
targets:
  Example:
    type: application
    platform: iOS
    sources:
      - Example
    dependencies:
      - package: DeclarativeCombine
      - package: DeclarativeUIKit
    settings:
      base:
        INFOPLIST_FILE: Example/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.declarativecombine.Example
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  Example:
    build:
      targets:
        Example: all
    run:
      config: Debug
    archive:
      config: Release
